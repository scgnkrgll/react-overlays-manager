name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC: npm trusted publishing (with provenance) and JSR, no stored tokens

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11, required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # `npm stage` needs a recent npm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build && pnpm lint:pkg
      # Uploads the release as staged; it goes public once approved with 2FA (`npm stage approve`).
      - run: npm stage publish

  jsr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: npx jsr publish
